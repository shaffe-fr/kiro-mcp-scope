[package]
name = "kmc-spike-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# crossterm is used through ratatui's re-export (ratatui::crossterm) so the
# event types always match the backend's own version.
ratatui = "0.30.2"

[profile.release]
# Comparable to the Go build's -ldflags="-s -w": drop symbols, keep everything
# else at default release settings.
strip = true
